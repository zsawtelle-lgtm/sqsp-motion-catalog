<!-- SWTL MOTION · 16 BEFORE / AFTER SLIDER — section marker
     Paste into a Code Block inside the section that holds the two images:
     the BEFORE image block first (top / left), then the AFTER image block.
     The Code Block renders nothing; you can tuck it into any corner.
     All attributes are optional:
       data-pair          "beforeBlockId afterBlockId" to pick the two blocks
       data-start         divider start position in % (50)
       data-hint          false = skip the 50 -> 35 -> 50 intro nudge
       data-labels        true (default) | false | alt (use the alt text)
       data-before-label  label text ("Before")
       data-after-label   label text ("After")
       data-aria-label    slider name for screen readers -->
<div data-swtl-beforeafter data-before-label="Before" data-after-label="After" hidden></div>
