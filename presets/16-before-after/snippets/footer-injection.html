     SWTL MOTION · 16 BEFORE / AFTER SLIDER            v1.0.0
     Paste into: Settings > Developer Tools > Code Injection > FOOTER
     Per section: Code Block with <div data-swtl-beforeafter hidden></div>
     Docs: presets/16-before-after/INSTALL.md

<style>
  /* Colors: --swtl-paper / --swtl-ink / --swtl-accent; --swtl-ba-* overrides */
  .swtl-ba-host { position: relative; }
  .swtl-ba-ui, .swtl-ba-after { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  .swtl-ba-ui { z-index: 3; cursor: ew-resize; touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .swtl-ba-after { overflow: hidden; clip-path: inset(0 0 0 calc(var(--swtl-ba-pos, 50) * 1%)); }
  .swtl-ba-after img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .swtl-ba-line, .swtl-ba-handle { position: absolute; left: calc(var(--swtl-ba-pos, 50) * 1%); }
  .swtl-ba-line { top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--swtl-ba-line, var(--swtl-paper, #F4F1EA)); box-shadow: 0 0 6px rgba(0,0,0,.18); }
  .swtl-ba-handle {
    top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--swtl-ba-handle, var(--swtl-paper, #F4F1EA)); color: var(--swtl-ba-icon, var(--swtl-ink, #1F1E1C));
    box-shadow: 0 2px 12px rgba(0,0,0,.22); transition: transform .2s cubic-bezier(.22,1,.36,1), color .2s;
  }
  .swtl-ba-handle svg { width: 30px; height: 30px; }
  .swtl-ba-ui:hover .swtl-ba-handle, .swtl-ba-drag .swtl-ba-handle { transform: scale(1.08); color: var(--swtl-accent, #D4552B); }
  .swtl-ba-handle:focus { outline: none; }
  .swtl-ba-handle:focus-visible { outline: 2px solid var(--swtl-accent, #D4552B); outline-offset: 3px; }
  .swtl-ba-label {
    position: absolute; top: 14px; padding: 7px 11px; border-radius: 999px; pointer-events: none;
    font-size: 11px; font-weight: 600; line-height: 1; letter-spacing: .12em; text-transform: uppercase;
    background: var(--swtl-ba-label-bg, var(--swtl-ink, #1F1E1C)); color: var(--swtl-ba-label, var(--swtl-paper, #F4F1EA)); transition: opacity .2s;
  }
  .swtl-ba-lb { left: 14px; }
  .swtl-ba-la { right: 14px; }
  .swtl-ba-label.swtl-ba-off { opacity: 0; }
  html.swtl-ba-on .swtl-ba-src { visibility: hidden; } /* after block: hidden only while running */
</style>
<script>
(function () {
  'use strict';
  /* CONFIG: window.SwtlBeforeAfter = {...} above this snippet; marker data-* override per section */
  var C = {
    start: 50,            /* % of the width showing "before" */
    hint: true,           /* ease 50 > 35 > 50 once on first view */
    labels: true,         /* true | false | 'alt' (use the alt text) */
    beforeLabel: 'Before',
    afterLabel: 'After',
    step: 5,              /* % per arrow key */
    threshold: 0.5
  };
  var u = window.SwtlBeforeAfter || {};
  for (var k in u) { if (Object.prototype.hasOwnProperty.call(u, k)) C[k] = u[k]; }

  var HINT_DX = -15, HINT_OUT = 550, HINT_HOLD = 150, HINT_BACK = 700;
  var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7.5 4.5 12 9 16.5M15 7.5l4.5 4.5-4.5 4.5"/></svg>';

  var framed = true;
  try { framed = window.self !== window.top; } catch (e) {}
  if (framed) return;
  var still = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var root = document.documentElement, body = document.body;
  var io = null, pairs = [], running = false;

  function editing() {
    return body.classList.contains('sqs-edit-mode-active') || body.classList.contains('sqs-is-page-editing');
  }
  function opt(m, name, d) {
    var v = m.getAttribute('data-' + name);
    return v === null || v === '' ? d : v === 'true' ? true : v === 'false' ? false : v;
  }
  function el(tag, cls, parent) {
    var n = document.createElement(tag); n.className = cls;
    if (parent) parent.appendChild(n);
    return n;
  }
  function ease(p) { return 0.5 - 0.5 * Math.cos(Math.PI * p); }
  function srcOf(im) { return im.currentSrc || im.getAttribute('src') || im.getAttribute('data-src') || ''; }
  function free(b) { return b && !b.classList.contains('swtl-ba-used') && b.querySelector('img'); }
  function byId(id) {
    var n = id && document.getElementById(id.replace(/^#/, ''));
    return n && (n.closest('.image-block') || n.querySelector('.image-block'));
  }

  /* data-pair="beforeId afterId", else the first two free image blocks in reading order */
  function findPair(m, section) {
    var ids = opt(m, 'pair', '');
    if (ids) {
      var q = String(ids).split(/[\s,]+/), a = byId(q[0]), b = byId(q[1]);
      return free(a) && free(b) && a !== b ? [a, b] : [];
    }
    var list = section.querySelectorAll('.sqs-block.image-block'), out = [];
    for (var i = 0; i < list.length; i++) if (free(list[i])) out.push(list[i]);
    out.sort(function (x, y) {
      var r = x.getBoundingClientRect(), s = y.getBoundingClientRect();
      return (Math.abs(r.top - s.top) > 8 ? r.top - s.top : 0) || r.left - s.left;
    });
    return out.slice(0, 2);
  }

  function set(p, v) {
    v = Math.max(0, Math.min(100, v));
    p.v = v;
    p.ui.style.setProperty('--swtl-ba-pos', v.toFixed(2));
    p.h.setAttribute('aria-valuenow', Math.round(v));
    p.h.setAttribute('aria-valuetext', Math.round(v) + '% before');
    if (p.lb) { p.lb.classList.toggle('swtl-ba-off', v < 18); p.la.classList.toggle('swtl-ba-off', v > 82); }
  }
  function stop(p) { p.touched = true; if (p.raf) cancelAnimationFrame(p.raf); p.raf = 0; }

  function hint(p) {
    if (p.touched) return;
    var t0 = performance.now(), s = p.start, to = s + HINT_DX;
    (function tick(now) {
      var t = now - t0;
      if (t < HINT_OUT) set(p, s + (to - s) * ease(t / HINT_OUT));
      else if (t < HINT_OUT + HINT_HOLD) set(p, to);
      else if (t < HINT_OUT + HINT_HOLD + HINT_BACK) set(p, to + (s - to) * ease((t - HINT_OUT - HINT_HOLD) / HINT_BACK));
      else { set(p, s); p.raf = 0; return; }
      p.raf = requestAnimationFrame(tick);
    })(t0);
  }

  function build(m) {
    var section = m.closest('section.page-section');
    var pr = section ? findPair(m, section) : [];
    if (pr.length < 2) return;
    var A = pr[0], B = pr[1], ia = A.querySelector('img'), ib = B.querySelector('img');
    var host = ia.closest('.fluid-image-container') || ia.parentNode;
    var start = parseFloat(opt(m, 'start', C.start));
    var ui = el('div', 'swtl-ba-ui'), after = el('div', 'swtl-ba-after', ui);
    var clone = el('img', '', after);
    clone.src = srcOf(ib);
    clone.alt = ib.getAttribute('alt') || '';
    clone.draggable = false;
    clone.style.objectPosition = getComputedStyle(ib).objectPosition;
    el('div', 'swtl-ba-line', ui);
    var h = el('div', 'swtl-ba-handle', ui);
    var at = { role: 'slider', tabindex: '0', 'aria-valuemin': '0', 'aria-valuemax': '100',
               'aria-label': opt(m, 'aria-label', 'Before and after comparison') };
    for (var a in at) h.setAttribute(a, at[a]);
    h.innerHTML = ICON;

    var p = { A: A, B: B, ui: ui, host: host, h: h, ib: ib, start: isNaN(start) ? 50 : start, raf: 0, touched: false };
    var lab = opt(m, 'labels', C.labels), alt = lab === 'alt';
    if (lab) {
      p.lb = el('span', 'swtl-ba-label swtl-ba-lb', ui);
      p.la = el('span', 'swtl-ba-label swtl-ba-la', ui);
      p.lb.textContent = opt(m, 'before-label', (alt && ia.getAttribute('alt')) || C.beforeLabel);
      p.la.textContent = opt(m, 'after-label', (alt && ib.getAttribute('alt')) || C.afterLabel);
      p.lb.setAttribute('aria-hidden', 'true');
      p.la.setAttribute('aria-hidden', 'true');
    }
    p.sync = function () { var s = srcOf(ib); if (s && s !== clone.src) clone.src = s; };
    ib.addEventListener('load', p.sync);   /* lazy-loaded after image */

    var drag = null;
    function move(e) { var r = ui.getBoundingClientRect(); if (r.width) set(p, (e.clientX - r.left) / r.width * 100); }
    function end(e) { if (drag === e.pointerId) { drag = null; ui.classList.remove('swtl-ba-drag'); } }
    ui.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      if (e.pointerType === 'mouse') e.preventDefault();
      stop(p);
      drag = e.pointerId;
      try { ui.setPointerCapture(drag); } catch (x) {}
      ui.classList.add('swtl-ba-drag');
      move(e);
    });
    ui.addEventListener('pointermove', function (e) { if (drag === e.pointerId) move(e); });
    ui.addEventListener('pointerup', end);
    ui.addEventListener('pointercancel', end);
    h.addEventListener('keydown', function (e) {
      var key = e.key, st = parseFloat(C.step) || 5;
      var v = key === 'Home' ? 0 : key === 'End' ? 100 :
              /^Arrow(Right|Up)$/.test(key) ? p.v + st : /^Arrow(Left|Down)$/.test(key) ? p.v - st : null;
      if (v === null) return;
      e.preventDefault();
      stop(p);
      set(p, v);
    });

    host.classList.add('swtl-ba-host');
    A.classList.add('swtl-ba-used');
    B.classList.add('swtl-ba-used', 'swtl-ba-src');
    host.appendChild(ui);
    set(p, p.start);
    p.hint = opt(m, 'hint', C.hint) && !still;
    pairs.push(p);
  }

  function onIntersect(entries) {
    for (var i = 0; i < entries.length; i++) {
      if (!entries[i].isIntersecting) continue;
      io.unobserve(entries[i].target);
      for (var j = 0; j < pairs.length; j++) if (pairs[j].ui === entries[i].target) hint(pairs[j]);
    }
  }

  function init() {
    if (running || editing()) return;
    var markers = document.querySelectorAll('[data-swtl-beforeafter]');
    if (!markers.length) return;
    running = true;
    pairs = [];
    for (var i = 0; i < markers.length; i++) build(markers[i]);
    if (!pairs.length) { running = false; return; }
    root.classList.add('swtl-ba-on');
    if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(onIntersect, { threshold: C.threshold });
    for (var j = 0; j < pairs.length; j++) if (pairs[j].hint) io.observe(pairs[j].ui);
  }

  function teardown() {
    if (io) { io.disconnect(); io = null; }
    for (var i = 0; i < pairs.length; i++) {
      var p = pairs[i];
      stop(p);
      p.ib.removeEventListener('load', p.sync);
      if (p.ui.parentNode) p.ui.parentNode.removeChild(p.ui);
      p.host.classList.remove('swtl-ba-host');
      p.A.classList.remove('swtl-ba-used');
      p.B.classList.remove('swtl-ba-used', 'swtl-ba-src');
    }
    pairs = [];
    root.classList.remove('swtl-ba-on');
    running = false;
  }

  /* editor: tear down on edit, re-init on exit */
  new MutationObserver(function () {
    if (editing()) { if (running) teardown(); } else if (!running) init();
  }).observe(body, { attributes: true, attributeFilter: ['class'] });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<!-- ============ end SWTL before / after slider ============ -->
